<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>账本</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ==================== 主应用 ==================== -->
<div class="app" id="mainApp">
    <!-- ==================== 人员切换 + 管理入口 ==================== -->
    <div class="person-section">
        <div class="section-label">
            <span>谁在记账？ <span class="badge">点击切换</span></span>
            <button class="manage-btn" id="manageMemberBtn">管理成员</button>
        </div>
        <div class="person-selector" id="personSelector">
            <!-- 动态由 JavaScript 生成 -->
        </div>
    </div>

    <!-- ==================== 三栏等宽布局（顶部对齐） ==================== -->
    <div class="triple-col">
        <!-- ===== 列1：账本 ===== -->
        <div class="col">
            <div class="module-box income-module">
                <div class="module-header">
                    <h2>账本</h2>
                    <div class="date-picker">
                        日期：
                        <input type="date" id="incomeDate" />
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>收入 (¥)</label>
                            <div class="currency"><input type="number" id="incomeAmt" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                        <div class="field">
                            <label>货款 (¥)</label>
                            <div class="currency"><input type="number" id="goodsAmt" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="noteInput" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="submitBtn">记录</button>
                </div>
                <div class="stats-section">
                    <div id="incomeGlobalStats" class="global-stats-container"></div>
                    <div class="section-label">所选日期的明细</div>
                    <div id="incomeStatsContainer"></div>
                    <div class="grand-total" id="incomeGrandTotal"></div>
                </div>
                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部记录</div>
                        <button class="clear-btn" id="clearIncomeBtn">清空全部</button>
                    </div>
                    <div class="record-list" id="incomeRecordList"></div>
                </div>
            </div>
        </div>

        <!-- ===== 列2：支出 ===== -->
        <div class="col">
            <div class="module-box family-module">
                <div class="module-header">
                    <h2>支出</h2>
                    <div class="date-picker">
                        日期：
                        <input type="date" id="familyDate" />
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>个人支出 (¥)</label>
                            <div class="currency"><input type="number" id="personalExpense" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                        <div class="field">
                            <label>家庭支出 (¥)</label>
                            <div class="currency"><input type="number" id="familyExpense" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="familyNote" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="familySubmitBtn">记录</button>
                </div>
                <div class="stats-section">
                    <div id="familyGlobalStats" class="global-stats-container"></div>
                    <div class="section-label">所选日期的明细</div>
                    <div id="familyStatsContainer"></div>
                    <div class="grand-total" id="familyGrandTotal"></div>
                </div>
                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部支出记录</div>
                        <button class="clear-btn" id="clearFamilyBtn">清空全部</button>
                    </div>
                    <div class="record-list" id="familyRecordList"></div>
                </div>
            </div>
        </div>

        <!-- ===== 列3：债务 + 还款（内嵌） ===== -->
        <div class="col">
            <div class="module-box debt-module">
                <div class="module-header">
                    <h2>债务</h2>
                    <div class="date-picker">
                        日期：
                        <input type="date" id="debtDate" />
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>欠款 (¥)</label>
                            <div class="currency"><input type="number" id="debtAmount" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                        <div class="field">
                            <label>货款欠款 (¥)</label>
                            <div class="currency"><input type="number" id="debtGoodsAmount" placeholder="0.00" step="0.01" min="0" /></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="debtNote" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="debtSubmitBtn">记录</button>
                </div>
                <div class="stats-section" id="debtStats">
                    <div id="debtGlobalStats" class="global-stats-container"></div>
                    <div class="section-label">所选日期的明细</div>
                    <div id="debtStatsContainer"></div>
                </div>
                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部债务记录</div>
                        <button class="clear-btn" id="clearDebtBtn">清空全部</button>
                    </div>
                    <div class="record-list" id="debtRecordList"></div>

                    <!-- 虚线分隔 -->
                    <hr class="section-divider" />

                    <!-- 还款区域（内嵌） -->
                    <div class="repayment-section">
                        <div class="repayment-header">
                            <h3>还款</h3>
                        </div>
                        <div class="repayment-body">
                            <div class="repayment-row">
                                <div class="field">
                                    <label>还款金额 (¥)</label>
                                    <div class="currency">
                                        <input type="number" id="repaymentAmount" placeholder="0.00" step="0.01" min="0" />
                                    </div>
                                </div>
                                <div class="field">
                                    <label>扣款类型</label>
                                    <select id="repaymentType">
                                        <option value="amount">欠款</option>
                                        <option value="goodsAmount">货款欠款</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field">
                                <label>搜索备注（匹配债务记录）</label>
                                <input type="text" id="repaymentSearch" placeholder="输入关键词搜索，留空显示无备注记录" />
                            </div>
                            <div class="repayment-results" id="repaymentResults">
                                <div class="empty-state">输入关键词搜索债务记录</div>
                            </div>
                            <button class="btn-submit repayment-btn" id="repaymentSubmitBtn">确认还款</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 刷新按钮 ==================== -->
    <div style="text-align:right; margin-top:16px;">
        <button class="logout-btn" id="refreshBtn">刷新数据</button>
    </div>
</div>

<!-- ==================== 成员管理模态框 ==================== -->
<div class="modal-overlay" id="memberModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">成员管理</span>
            <button class="modal-close" id="memberModalClose">✕</button>
        </div>
        <div class="modal-body">
            <div class="member-list" id="memberList">
                <!-- 动态渲染 -->
            </div>
            <div class="member-add">
                <input type="text" id="newMemberInput" placeholder="输入新成员姓名" />
                <button class="btn-submit" id="addMemberBtn" style="width:auto; padding:8px 16px; margin-top:8px;">添加</button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== Toast 全局提示 ==================== -->
<div class="toast" id="toast"></div>

<!-- ==================== 更新公告弹窗 ==================== -->
<div class="modal-overlay" id="updateModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">更新公告</span>
        </div>
        <div class="modal-body">
            <div class="version-info">
                版本 <span id="oldVersion"></span> → <span id="newVersion"></span>
            </div>
            <ul class="update-list" id="updateList">
                <!-- 由 JavaScript 动态填充 -->
            </ul>
        </div>
        <div class="modal-footer">
            <button class="modal-btn" id="modalConfirmBtn">确认</button>
        </div>
    </div>
</div>

<!-- ==================== 页脚：版本号 ==================== -->
<footer class="app-footer">
    当前版本：<span id="version"></span>
</footer>

<!-- ==================== 第三方库 & 应用脚本 ==================== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="update-log.js"></script>
<script src="script.js"></script>

</body>
</html>
