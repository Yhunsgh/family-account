<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📒 收支账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f7f3ee;
            color: #3d2c1e;
            padding: 16px 16px 40px;
            min-height: 100vh;
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 18px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #5a3e2b;
        }
        .header h1 span { font-size: 26px; margin-right: 4px; }
        .header .date-picker {
            background: #ede7e0;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #5a3e2b;
            font-weight: 500;
        }
        .header .date-picker input[type="date"] {
            border: none;
            background: transparent;
            font-size: 14px;
            color: #5a3e2b;
            font-weight: 500;
            outline: none;
            padding: 4px 0;
            width: 130px;
            font-family: inherit;
        }
        .header .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.6;
            padding: 0;
        }

        /* ========== 人员选择 ========== */
        .section-label {
            font-size: 15px;
            font-weight: 600;
            color: #5a3e2b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label .badge {
            font-size: 12px;
            background: #e8ddd2;
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 400;
            color: #6b4f38;
        }
        .person-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .person-btn {
            flex: 1;
            padding: 12px 0;
            border: 2px solid #e8ddd2;
            border-radius: 18px;
            background: #fcfaf8;
            font-size: 18px;
            font-weight: 600;
            color: #5a3e2b;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .person-btn:active { transform: scale(0.96); }
        .person-btn.active {
            border-color: #c9a77b;
            background: #f5ede4;
            box-shadow: 0 0 0 3px rgba(201,167,123,0.2);
        }
        .person-btn .emoji { display: block; font-size: 26px; margin-bottom: 2px; }

        /* ========== 输入区域 ========== */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row .field { flex: 1; min-width: 100px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #7a624c;
            margin-bottom: 4px;
        }
        .field input,
        .field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e8ddd2;
            border-radius: 14px;
            font-size: 16px;
            background: #fcfaf8;
            color: #3d2c1e;
            transition: border 0.2s;
            outline: none;
            font-family: inherit;
        }
        .field input:focus,
        .field textarea:focus {
            border-color: #c9a77b;
            background: #ffffff;
        }
        .field textarea {
            resize: vertical;
            min-height: 52px;
            font-size: 15px;
        }
        .field .currency { position: relative; }
        .field .currency input { padding-left: 30px; }
        .field .currency::before {
            content: "¥";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a5856a;
            font-weight: 600;
            font-size: 16px;
            pointer-events: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 18px;
            background: #c9a77b;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(201,167,123,0.3);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled { opacity: 0.6; transform: none; }

        /* ========== 统计看板 ========== */
        .stats-section {
            margin-top: 28px;
            border-top: 1.5px dashed #e8ddd2;
            padding-top: 22px;
        }

        /* 盈利卡片 */
        .profit-card {
            background: #e6f0fa;
            border-radius: 18px;
            border: 2px solid #6f8c9b;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .profit-card .profit-label {
            font-size: 16px;
            font-weight: 600;
            color: #2c4a5e;
        }
        .profit-card .profit-amount {
            font-size: 24px;
            font-weight: 700;
        }
        .profit-card .profit-amount.positive { color: #2e7d32; }
        .profit-card .profit-amount.negative { color: #c62828; }
        .profit-card .profit-amount.zero { color: #6f8c9b; }

        .member-stat-card {
            background: #fcfaf8;
            border-radius: 18px;
            border: 1px solid #ede7e0;
            padding: 14px 14px 10px;
            margin-bottom: 14px;
        }
        .member-stat-card:last-child { margin-bottom: 0; }
        .member-stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .member-stat-header .name {
            font-size: 18px;
            font-weight: 700;
            color: #5a3e2b;
        }
        .member-stat-header .name .emoji-sm { font-size: 22px; margin-right: 4px; }
        .member-stat-header .totals {
            display: flex;
            gap: 16px;
            font-size: 15px;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .member-stat-header .totals .cost { color: #b88a5e; }
        .member-stat-header .totals .income { color: #6f8c9b; }
        .member-stat-header .totals .goods { color: #d4a373; }
        .member-stat-header .totals .count { color: #a5856a; font-weight: 400; }

        .member-detail-list {
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid #ede7e0;
            padding-top: 8px;
            margin-top: 6px;
        }
        .member-detail-list::-webkit-scrollbar { width: 4px; }
        .member-detail-list::-webkit-scrollbar-thumb { background: #dccfc2; border-radius: 10px; }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f5f0eb;
            font-size: 14px;
            gap: 6px;
        }
        .detail-item:last-child { border-bottom: none; }
        .detail-item .left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .detail-item .left .date {
            font-size: 12px;
            color: #a5856a;
            white-space: nowrap;
        }
        .detail-item .left .note {
            font-size: 13px;
            color: #7a624c;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100px;
        }
        .detail-item .right {
            display: flex;
            gap: 10px;
            white-space: nowrap;
            font-weight: 500;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .detail-item .right .cost { color: #b88a5e; }
        .detail-item .right .income { color: #6f8c9b; }
        .detail-item .right .goods { color: #d4a373; }
        .detail-empty {
            text-align: center;
            color: #b8a392;
            font-size: 14px;
            padding: 10px 0;
        }

        .grand-total {
            display: flex;
            justify-content: space-around;
            background: #f5ede4;
            border-radius: 16px;
            padding: 12px 10px;
            margin-top: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #5a3e2b;
            flex-wrap: wrap;
            gap: 8px;
        }
        .grand-total .item { text-align: center; }
        .grand-total .item .num { font-weight: 700; font-size: 18px; }
        .grand-total .item .num.cost { color: #b88a5e; }
        .grand-total .item .num.income { color: #6f8c9b; }
        .grand-total .item .num.goods { color: #d4a373; }

        /* ========== 最近记录 ========== */
        .history-section {
            margin-top: 24px;
            border-top: 1.5px dashed #e8ddd2;
            padding-top: 18px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .history-header .clear-btn {
            font-size: 13px;
            color: #b88a5e;
            background: #f5ede4;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .history-header .clear-btn:active { opacity: 0.6; }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .record-list::-webkit-scrollbar { width: 4px; }
        .record-list::-webkit-scrollbar-thumb { background: #dccfc2; border-radius: 10px; }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fcfaf8;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #ede7e0;
            font-size: 14px;
            animation: fadeIn 0.2s ease;
        }
        .record-item .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }
        .record-item .left .top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .record-item .left .top .pname { font-weight: 600; color: #5a3e2b; }
        .record-item .left .top .pdate {
            font-size: 12px;
            color: #a5856a;
        }
        .record-item .left .note {
            font-size: 13px;
            color: #7a624c;
            word-break: break-all;
        }
        .record-item .right {
            text-align: right;
            flex-shrink: 0;
            margin-left: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            justify-content: flex-end;
        }
        .record-item .right .cost { color: #b88a5e; font-weight: 600; }
        .record-item .right .income { color: #6f8c9b; font-weight: 600; }
        .record-item .right .goods { color: #d4a373; font-weight: 600; }
        .record-item .right .empty { color: #ccc; }
        .record-item .del-btn {
            background: none;
            border: none;
            color: #d4c0b0;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 6px;
        }
        .record-item .del-btn:active { color: #b88a5e; }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #b8a392;
            font-size: 15px;
        }
        .empty-state .icon { font-size: 42px; display: block; margin-bottom: 8px; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #3d2c1e;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.25s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .app { padding: 16px 12px 24px; }
            .member-stat-header .totals { font-size: 13px; gap: 10px; }
            .detail-item { font-size: 13px; }
            .detail-item .left .note { max-width: 70px; }
            .header .date-picker input[type="date"] { width: 100px; }
        }
        @media (max-width: 360px) {
            .member-stat-header { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <!-- 头部 -->
    <div class="header">
        <h1><span>📒</span>收支账本</h1>
        <div class="date-picker">
            📅
            <input type="date" id="selectedDate" />
        </div>
    </div>

    <!-- 人员选择 -->
    <div class="section-label">👤 谁在记账？ <span class="badge">点击切换</span></div>
    <div class="person-selector" id="personSelector">
        <button class="person-btn active" data-person="爸"><span class="emoji">👨</span> 爸</button>
        <button class="person-btn" data-person="妈"><span class="emoji">👩</span> 妈</button>
    </div>

    <!-- 输入区域 -->
    <div class="section-label">✏️ 记录一笔</div>
    <div class="input-group">
        <div class="input-row">
            <div class="field">
                <label>💸 支出 (¥)</label>
                <div class="currency"><input type="number" id="expenseAmt" placeholder="0.00" step="0.01" min="0" /></div>
            </div>
            <div class="field">
                <label>💰 收入 (¥)</label>
                <div class="currency"><input type="number" id="incomeAmt" placeholder="0.00" step="0.01" min="0" /></div>
            </div>
        </div>
        <div class="input-row">
            <div class="field" style="flex: 1;">
                <label>📦 货款 (¥)</label>
                <div class="currency"><input type="number" id="goodsAmt" placeholder="0.00" step="0.01" min="0" /></div>
            </div>
            <div class="field" style="flex: 1; visibility: hidden;"></div>
        </div>
        <div class="field">
            <label>📝 备注</label>
            <textarea id="noteInput" placeholder="比如：买菜、工资、货款…" rows="1"></textarea>
        </div>
    </div>
    <button class="btn-submit" id="submitBtn">✅ 记 录</button>

    <!-- 统计看板 -->
    <div class="stats-section">
        <div class="section-label">📊 所选日期的明细</div>
        <div id="statsContainer"></div>
        <div class="grand-total" id="grandTotal"></div>
    </div>

    <!-- 最近记录 -->
    <div class="history-section">
        <div class="history-header">
            <div class="section-label">📋 全部记录</div>
            <button class="clear-btn" id="clearAllBtn">🗑 清空全部</button>
        </div>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    // ================================================================
    //  1.  Firebase 配置（请替换为你的真实配置）
    // ================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA42r5qGK6t5h-Ggq7sC0m9pCv90yMIOI",
        authDomain: "family-account-book-22cc3.firebaseapp.co",
        databaseURL: "https://family-account-book-22cc3-default-rtdb.asia-southeast1.firebasedatabase.ap/",
        projectId: "family-account-book-22cc3",
        storageBucket: "family-account-book-22cc3.firebasestorage.app",
        messagingSenderId: "883258053961",
        appId: "1:883258053961:web:44d29f6635598b6a22f698"
    };

    let db = null;
    let isFirebaseReady = false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseReady = true;
        console.log("✅ Firebase 初始化成功");
    } catch (err) {
        console.error("❌ Firebase 初始化失败:", err);
        showToast("⚠️ Firebase 配置有误，请检查 config");
    }

    // ================================================================
    //  2.  应用状态
    // ================================================================
    const state = {
        currentPerson: '爸',
        records: [],
        selectedDate: new Date().toISOString().slice(0, 10),
    };

    // DOM
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const personBtns = $$('.person-btn');
    const expenseInput = $('#expenseAmt');
    const incomeAmtInput = $('#incomeAmt');
    const goodsInput = $('#goodsAmt');
    const noteInput = $('#noteInput');
    const submitBtn = $('#submitBtn');
    const statsContainer = $('#statsContainer');
    const grandTotal = $('#grandTotal');
    const recordList = $('#recordList');
    const selectedDateInput = $('#selectedDate');
    const clearAllBtn = $('#clearAllBtn');

    // ================================================================
    //  3.  工具函数
    // ================================================================
    function formatDate(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return `${d.getMonth()+1}月${d.getDate()}日`;
    }
    function toFixed(v) { return Number(v).toFixed(2); }
    function showToast(msg, duration = 2000) {
        const el = $('#toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), duration);
    }
    function getTodayStr() { return new Date().toISOString().slice(0, 10); }

    // ================================================================
    //  4.  人员选择
    // ================================================================
    personBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            personBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            state.currentPerson = this.dataset.person;
        });
    });

    // ================================================================
    //  5.  提交记录
    // ================================================================
    submitBtn.addEventListener('click', function() {
        if (!isFirebaseReady) { showToast('⚠️ 数据库未连接'); return; }
        const person = state.currentPerson;
        const expense = parseFloat(expenseInput.value) || 0;
        const income = parseFloat(incomeAmtInput.value) || 0;
        const goods = parseFloat(goodsInput.value) || 0;
        const note = noteInput.value.trim() || '';
        if (expense === 0 && income === 0 && goods === 0) {
            showToast('⚠️ 支出、收入或货款至少填一项');
            return;
        }

        const record = {
            person: person,
            date: state.selectedDate,
            expense: expense,
            income: income,
            goods: goods,
            note: note,
            createdAt: Date.now(),
        };

        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ 提交中...';
        const newRef = db.ref('familyRecords').push();
        newRef.set(record)
            .then(() => {
                showToast('✅ 记录成功！');
                expenseInput.value = '';
                incomeAmtInput.value = '';
                goodsInput.value = '';
                noteInput.value = '';
                expenseInput.focus();
            })
            .catch((err) => { console.error(err); showToast('❌ 提交失败'); })
            .finally(() => { submitBtn.disabled = false; submitBtn.textContent = '✅ 记 录'; });
    });

    noteInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitBtn.click(); }
    });

    // ================================================================
    //  6.  日期选择器
    // ================================================================
    selectedDateInput.value = getTodayStr();
    selectedDateInput.addEventListener('change', function() {
        state.selectedDate = this.value;
        renderAll();
    });

    // ================================================================
    //  7.  数据读取 & 实时更新
    // ================================================================
    function loadData() {
        if (!isFirebaseReady) {
            renderEmptyState('⏳ 等待数据库连接...');
            return;
        }
        const ref = db.ref('familyRecords');
        ref.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) { state.records = []; renderAll(); return; }
            const records = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            records.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            state.records = records;
            renderAll();
        }, (err) => { console.error(err); showToast('⚠️ 读取数据失败'); });
    }

    // ================================================================
    //  8.  渲染
    // ================================================================
    function renderAll() {
        renderStats();
        renderRecords();
    }

    // ---------- 统计看板（盈利 = 收入 - 货款，底部只显示三项总计） ----------
    function renderStats() {
        const records = state.records;
        const selectedDate = state.selectedDate;
        const dayRecords = records.filter(r => r.date === selectedDate);
        const persons = ['爸', '妈'];
        const emojiMap = { '爸': '👨', '妈': '👩' };

        // 计算当日总收入和总货款（支出独立显示，不影响盈利）
        const totalIncomeAll = dayRecords.reduce((sum, r) => sum + (r.income || 0), 0);
        const totalGoodsAll = dayRecords.reduce((sum, r) => sum + (r.goods || 0), 0);
        const profit = totalIncomeAll - totalGoodsAll;   // 盈利 = 收入 - 货款

        // 盈利卡片
        let profitHtml = `<div class="profit-card">`;
        profitHtml += `<span class="profit-label">📈 所选日期 (${formatDate(selectedDate)}) 盈利</span>`;
        let profitClass = 'zero';
        if (profit > 0) profitClass = 'positive';
        else if (profit < 0) profitClass = 'negative';
        profitHtml += `<span class="profit-amount ${profitClass}">¥${toFixed(profit)}</span>`;
        profitHtml += `</div>`;

        // 成员卡片
        let html = profitHtml;
        persons.forEach(p => {
            const pRecords = dayRecords.filter(r => r.person === p);
            const totalExpense = pRecords.reduce((sum, r) => sum + (r.expense || 0), 0);
            const totalIncome = pRecords.reduce((sum, r) => sum + (r.income || 0), 0);
            const totalGoods = pRecords.reduce((sum, r) => sum + (r.goods || 0), 0);

            html += `<div class="member-stat-card">`;
            html += `<div class="member-stat-header">
                        <span class="name"><span class="emoji-sm">${emojiMap[p]}</span> ${p}</span>
                        <span class="totals">
                            <span class="cost">-¥${toFixed(totalExpense)}</span>
                            <span class="income">+¥${toFixed(totalIncome)}</span>
                            <span class="goods">📦¥${toFixed(totalGoods)}</span>
                            <span class="count">${pRecords.length}笔</span>
                        </span>
                    </div>`;

            if (pRecords.length === 0) {
                html += `<div class="member-detail-list"><div class="detail-empty">当天无记录</div></div>`;
            } else {
                html += `<div class="member-detail-list">`;
                const sorted = [...pRecords].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                sorted.forEach(r => {
                    const expense = r.expense || 0;
                    const income = r.income || 0;
                    const goods = r.goods || 0;
                    const dateStr = r.date || '未知';
                    const note = r.note || '';
                    let amountHtml = '';
                    if (expense > 0) amountHtml += `<span class="cost">-¥${toFixed(expense)}</span>`;
                    if (income > 0) amountHtml += `<span class="income">+¥${toFixed(income)}</span>`;
                    if (goods > 0) amountHtml += `<span class="goods">📦¥${toFixed(goods)}</span>`;
                    if (!amountHtml) amountHtml = `<span>—</span>`;
                    html += `<div class="detail-item">
                                <div class="left">
                                    <span class="date">${formatDate(dateStr)}</span>
                                    ${note ? `<span class="note" title="${note}">${note}</span>` : ''}
                                </div>
                                <div class="right">${amountHtml}</div>
                            </div>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
        });
        statsContainer.innerHTML = html;

        // 总计合计（只显示三项，不显示笔数）
        const allExpense = dayRecords.reduce((sum, r) => sum + (r.expense || 0), 0);
        const allIncome = dayRecords.reduce((sum, r) => sum + (r.income || 0), 0);
        const allGoods = dayRecords.reduce((sum, r) => sum + (r.goods || 0), 0);
        grandTotal.innerHTML = `
            <div class="item">💸 总支出 <span class="num cost">¥${toFixed(allExpense)}</span></div>
            <div class="item">💰 总收入 <span class="num income">¥${toFixed(allIncome)}</span></div>
            <div class="item">📦 总货款 <span class="num goods">¥${toFixed(allGoods)}</span></div>
        `;
    }

    // ---------- 全部记录 ----------
    function renderRecords() {
        const records = state.records;
        if (!records || records.length === 0) {
            recordList.innerHTML = `<div class="empty-state"><span class="icon">📭</span>还没有记录，快来记一笔吧！</div>`;
            return;
        }
        const showRecords = records.slice(0, 50);
        const emojiMap = { '爸': '👨', '妈': '👩' };
        let html = '';
        showRecords.forEach((r, index) => {
            const dateStr = r.date || '未知日期';
            const note = r.note || '';
            const expense = r.expense || 0;
            const income = r.income || 0;
            const goods = r.goods || 0;
            let rightHtml = '';
            if (expense > 0) rightHtml += `<span class="cost">-¥${toFixed(expense)}</span>`;
            if (income > 0) rightHtml += `<span class="income">+¥${toFixed(income)}</span>`;
            if (goods > 0) rightHtml += `<span class="goods">📦¥${toFixed(goods)}</span>`;
            if (!rightHtml) rightHtml = `<span class="empty">—</span>`;
            html += `
                <div class="record-item" data-id="${r.id}" style="animation-delay:${index * 20}ms">
                    <div class="left">
                        <div class="top">
                            <span class="pname">${emojiMap[r.person] || '👤'} ${r.person}</span>
                            <span class="pdate">${formatDate(dateStr)}</span>
                        </div>
                        ${note ? `<div class="note">📌 ${note}</div>` : ''}
                    </div>
                    <div class="right">
                        ${rightHtml}
                        <button class="del-btn" data-id="${r.id}" title="删除">✕</button>
                    </div>
                </div>
            `;
        });
        recordList.innerHTML = html;
        recordList.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                if (id && confirm('确定删除这条记录吗？')) deleteRecord(id);
            });
        });
    }

    // ---------- 删除 & 清空 ----------
    function deleteRecord(id) {
        if (!isFirebaseReady) return;
        db.ref(`familyRecords/${id}`).remove()
            .then(() => showToast('🗑 已删除'))
            .catch(() => showToast('❌ 删除失败'));
    }

    clearAllBtn.addEventListener('click', function() {
        if (state.records.length === 0) { showToast('📭 没有记录'); return; }
        if (confirm('⚠️ 确定清空所有记录吗？不可恢复！')) {
            if (!isFirebaseReady) return;
            db.ref('familyRecords').remove()
                .then(() => showToast('🗑 已清空'))
                .catch(() => showToast('❌ 清空失败'));
        }
    });

    function renderEmptyState(msg) {
        statsContainer.innerHTML = `<div class="member-stat-card" style="text-align:center;color:#b8a392;padding:20px;">${msg}</div>`;
        grandTotal.innerHTML = '';
        recordList.innerHTML = `<div class="empty-state"><span class="icon">⏳</span>${msg}</div>`;
    }

    // ================================================================
    //  9.  启动
    // ================================================================
    loadData();

    expenseInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); incomeAmtInput.focus(); } });
    incomeAmtInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); goodsInput.focus(); } });
    goodsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); noteInput.focus(); } });

    statsContainer.addEventListener('click', (e) => {
        const card = e.target.closest('.member-stat-card');
        if (!card) return;
        const nameEl = card.querySelector('.member-stat-header .name');
        if (!nameEl) return;
        const name = nameEl.textContent.trim();
        const map = { '👨爸': '爸', '👩妈': '妈' };
        const person = map[name] || name;
        if (['爸', '妈'].includes(person)) {
            personBtns.forEach(b => b.classList.toggle('active', b.dataset.person === person));
            state.currentPerson = person;
            showToast(`👤 切换到 ${person}`);
        }
    });

    console.log('📒 收支账本（盈利=收入-货款，底部只显示三项总计）已启动！');
</script>
</body>
</html>
