<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>账本</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="mainApp">
    <!-- 人员切换 + 管理入口 + 统一日期 -->
    <div class="person-section">
        <div class="section-label">
            <div class="person-chips" id="personChips"></div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <button class="manage-btn" id="manageMemberBtn">管理成员</button>
                <button class="manage-btn" id="showUpdateBtn">更新公告</button>
                <div class="date-picker" style="display:inline-flex; align-items:center; gap:4px; background:var(--color-border); padding:2px 12px 2px 8px; border-radius:30px; font-size:14px; color:var(--color-text-light); font-weight:500;">
                    统一日期：
                    <input type="date" id="globalDate" style="border:none; background:transparent; font-size:14px; color:var(--color-text-light); font-weight:500; outline:none; padding:4px 0; width:120px; font-family:inherit;" />
                </div>
            </div>
        </div>
    </div>

    <!-- 财务总览卡片 -->
    <div class="overview-section" id="overviewSection">
        <div class="overview-grid">
            <div class="overview-group">
                <div class="group-label">本月</div>
                <div class="group-items">
                    <div class="overview-item">
                        <span class="label">盈利</span>
                        <span class="value income" id="overviewMonthIncome">¥0.00</span>
                    </div>
                    <div class="overview-item">
                        <span class="label">支出</span>
                        <span class="value expense" id="overviewMonthExpense">¥0.00</span>
                    </div>
                    <div class="overview-item">
                        <span class="label">新增欠款</span>
                        <span class="value debt" id="overviewMonthDebt">¥0.00</span>
                    </div>
                </div>
            </div>
            <div class="overview-group">
                <div class="group-label">总计</div>
                <div class="group-items">
                    <div class="overview-item">
                        <span class="label">盈利</span>
                        <span class="value income" id="overviewTotalIncome">¥0.00</span>
                    </div>
                    <div class="overview-item">
                        <span class="label">支出</span>
                        <span class="value expense" id="overviewTotalExpense">¥0.00</span>
                    </div>
                    <div class="overview-item">
                        <span class="label">当前欠款</span>
                        <span class="value debt" id="overviewTotalDebt">¥0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 三栏布局 -->
    <div class="triple-col">
        <!-- 列1：账本 -->
        <div class="col">
            <div class="module-box">
                <div class="module-header">
                    <h2>账本</h2>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>收入 (¥)</label>
                            <div class="currency"><input type="number" id="incomeAmt" placeholder="0.00" step="0.01" min="0" onfocus="this.select()" /></div>
                        </div>
                        <div class="field">
                            <label>货款 (¥)</label>
                            <div class="currency"><input type="number" id="goodsAmt" placeholder="0.00" step="0.01" min="0" onfocus="this.select()" /></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="incomeNote" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="incomeSubmitBtn">记录</button>
                </div>
                <div class="stats-section">
                    <div class="section-label">所选日期的明细</div>
                    <div id="incomeStatsContainer"></div>
                </div>
                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部记录</div>
                        <button class="clear-btn" id="clearIncomeBtn">清空所选日期</button>
                    </div>
                    <div class="record-list" id="incomeRecordList"></div>
                </div>
            </div>
        </div>

        <!-- 列2：支出 -->
        <div class="col">
            <div class="module-box">
                <div class="module-header">
                    <h2>支出</h2>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>支出 (¥)</label>
                            <div class="currency"><input type="number" id="expenseAmt" placeholder="0.00" step="0.01" min="0" onfocus="this.select()" /></div>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="expenseNote" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="expenseSubmitBtn">记录</button>
                </div>
                <div class="stats-section">
                    <div class="section-label">所选日期的明细</div>
                    <div id="expenseStatsContainer"></div>
                </div>
                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部支出记录</div>
                        <button class="clear-btn" id="clearExpenseBtn">清空所选日期</button>
                    </div>
                    <div class="record-list" id="expenseRecordList"></div>
                </div>
            </div>
        </div>

        <!-- 列3：债务（已移除“所选日期的明细”，还款模块上移） -->
        <div class="col">
            <div class="module-box">
                <div class="module-header">
                    <h2>债务</h2>
                </div>
                <div class="input-group">
                    <div class="input-row">
                        <div class="field">
                            <label>欠款金额 (¥)</label>
                            <div class="currency"><input type="number" id="debtAmt" placeholder="0.00" step="0.01" min="0" onfocus="this.select()" /></div>
                        </div>
                        <div class="field">
                            <label>欠款类型</label>
                            <select id="debtType">
                                <option value="amount">欠款</option>
                                <option value="goodsAmount">货款欠款</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label>备注</label>
                        <textarea id="debtNote" placeholder="请输入备注" rows="1"></textarea>
                    </div>
                    <button class="btn-submit" id="debtSubmitBtn">记录</button>
                </div>

                <!-- 还款模块（原在底部，现已上移至此处） -->
                <div class="repayment-section">
                    <div class="repayment-header">
                        <h3>还款</h3>
                    </div>
                    <div class="repayment-body">
                        <div class="repayment-row">
                            <div class="field">
                                <label>还款金额 (¥)</label>
                                <div class="currency">
                                    <input type="number" id="repaymentAmount" placeholder="0.00" step="0.01" min="0" onfocus="this.select()" />
                                </div>
                            </div>
                            <div class="field">
                                <label>扣款类型</label>
                                <select id="repaymentType">
                                    <option value="amount">欠款</option>
                                    <option value="goodsAmount">货款欠款</option>
                                </select>
                            </div>
                        </div>
                        <div class="field">
                            <label>搜索备注（匹配债务记录）</label>
                            <input type="text" id="repaymentSearch" placeholder="输入关键词搜索，留空显示无备注记录" />
                        </div>
                        <div class="repayment-results" id="repaymentResults">
                            <div class="empty-state">输入关键词搜索债务记录</div>
                        </div>
                        <button class="btn-submit repayment-btn" id="repaymentSubmitBtn">确认还款</button>
                    </div>
                </div>

                <div class="history-section">
                    <div class="history-header">
                        <div class="section-label">全部债务记录</div>
                        <button class="clear-btn" id="clearDebtBtn">清空所选日期</button>
                    </div>
                    <div class="record-list" id="debtRecordList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 刷新按钮已被移除 -->
</div>

<!-- 成员管理模态框 -->
<div class="modal-overlay" id="memberModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">成员管理</span>
            <button class="modal-close" id="memberModalClose">✕</button>
        </div>
        <div class="modal-body">
            <div class="member-list" id="memberList"></div>
            <div class="member-add">
                <input type="text" id="newMemberInput" placeholder="输入新成员姓名" />
                <button class="btn-submit" id="addMemberBtn" style="width:auto; padding:8px 16px; margin-top:8px;">添加</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 更新公告弹窗 -->
<div class="modal-overlay" id="updateModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">更新公告</span>
            <button class="modal-close" id="updateModalClose">✕</button>
        </div>
        <div class="modal-body">
            <div class="version-info">
                当前版本 <span id="newVersion"></span>
            </div>
            <ul class="update-list" id="updateList"></ul>
        </div>
        <div class="modal-footer">
            <button class="modal-btn" id="modalConfirmBtn">确认</button>
        </div>
    </div>
</div>

<footer class="app-footer">
    当前版本：<span id="version"></span>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="update-log.js"></script>
<script src="script.js"></script>

</body>
</html>
